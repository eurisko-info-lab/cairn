[package]
name = "cairn-verifier"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Independent Rust verifier for Cairn federation history"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
hex = "0.4"
sha2 = "0.10"
