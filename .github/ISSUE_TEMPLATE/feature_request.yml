name: Feature request
description: Propose new behavior, a new pack, or a change to an existing module
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: What problem does this solve?
      description: What can't you do today that this would enable?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: >
        If you have one. Note which module(s) this touches
        (kernel / content-core / contracts / system-handler / content-user /
        app-runtime / ...) — see docs/architecture.md for the current
        boundary map. Changes that cross the `user ↛ system-handler`
        prohibition need a different design, not an exception.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
